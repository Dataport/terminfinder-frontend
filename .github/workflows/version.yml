name: version.yml
on:
  pull_request:
    branches: [ 'main', 'dependencies' ]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cperezabo/setup-git-mkver@v1
        with:
          version: "1.2.0"
      - name: Next Version
        continue-on-error: true
        run: git mkver next --format '{Docker}'
