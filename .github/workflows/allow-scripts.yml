name: allow-scripts

on:
  pull_request:
    branches: [ 'main', 'dependencies' ]
    paths:
      - 'package.json'
      - 'package-lock.json'

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without running scripts
        run: npm ci --no-audit --no-fund --ignore-scripts --loglevel=error

      - name: Refresh allowScripts block
        run: npm approve-scripts --all

      - name: Commit updated allowScripts block
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if git diff --quiet -- package.json; then
            echo "allowScripts is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json
          git commit -m "chore: update allowScripts"
          git push origin "HEAD:${HEAD_REF}"
